<!-- Content Header (Page header) -->
<section class="content-header">
  <div class="container-fluid">
    <div class="row mb-2">
      <div class="col-sm-6">
        <h1>Manage Posts</h1>
      </div>
      <div class="col-sm-6">
        <ol class="breadcrumb float-sm-right">
          <li class="breadcrumb-item">
            <a routerLink="/admin/dashboard">Home</a>
          </li>
          <li class="breadcrumb-item active">Posts</li>
        </ol>
      </div>
    </div>
  </div>
</section>

<!-- Main content -->
<section class="content">
  <div class="container-fluid">
    <div class="card card-default">
      <div class="card-header">
        <h3 class="card-title">
          <i class="fas fa-filter"></i>
          Filters
        </h3>
      </div>
      <!-- /.card-header -->
      <div class="card-body">
        <form (submit)="onSearch($event, kw.value)">
          <div class="row">
            <!-- Search by Keyword -->
            <div class="col-md-5">
              <div class="form-group">
                <label>Search by Title:</label>
                <input
                  type="text"
                  #kw
                  [value]="keyword || ''"
                  class="form-control"
                  placeholder="Enter post title..."
                />
              </div>
            </div>

            <!-- Filter by Category -->
            <div class="col-md-5">
              <div class="form-group">
                <label>Category:</label>
                <select
                  class="form-control"
                  [value]="categoryId || ''"
                  (change)="onCategoryChange($event)"
                >
                  <option value="">-- All Categories --</option>
                  <option *ngFor="let c of categories" [value]="c.categoryid">
                    {{ c.categoryname }}
                  </option>
                </select>
              </div>
            </div>

            <!-- Submit Button -->
            <div class="col-md-2">
              <div class="form-group">
                <label> </label>
                <!-- Giữ khoảng trống để căn chỉnh -->
                <button type="submit" class="btn btn-primary btn-block">
                  <i class="fas fa-search"></i> Search
                </button>
              </div>
            </div>
          </div>
        </form>
      </div>
      <!-- /.card-body -->
    </div>
    <!-- /.card -->

    <div class="row">
      <div class="col-12">
        <div class="card">
          <div class="card-header">
            <h3 class="card-title">Post List</h3>
          </div>
          <!-- /.card-header -->
          <div class="card-body p-0">
            <table class="table table-striped">
              <thead>
                <tr>
                  <th style="width: 60px">#</th>
                  <th>Post</th>
                  <th>Author</th>
                  <th>Language</th>
                  <th style="width: 150px; text-align: center">Status</th>
                  <th style="width: 150px; text-align: center">Actions</th>
                </tr>
              </thead>
              <tbody>
                <tr *ngFor="let p of posts; let i = index">
                  <td>{{ (currentPage - 1) * 5 + i + 1 }}.</td>
                  <td>{{ p.title }}</td>
                  <td>{{ authorName(p) }}</td>
                  <td>{{ languageName(p) }}</td>
                  <td style="text-align: center">
                    <span class="badge" [ngClass]="statusBadge(p).cls">{{
                      statusBadge(p).text
                    }}</span>
                  </td>
                  <td style="text-align: center">
                    <a
                      class="btn btn-sm btn-primary"
                      data-toggle="tooltip"
                      title="View"
                      [routerLink]="['/admin/posts', p.postid]"
                      ><i class="fas fa-eye"></i
                    ></a>
                    <a
                      *ngIf="p.status === 1"
                      href="#"
                      class="btn btn-sm btn-success"
                      data-toggle="tooltip"
                      title="Publish"
                      (click)="$event.preventDefault(); onApprove(p)"
                    >
                      <i class="fas fa-check-circle"></i>
                    </a>
                    <a
                      *ngIf="p.status === 1 || p.status === 2"
                      href="#"
                      class="btn btn-sm btn-danger"
                      data-toggle="tooltip"
                      title="Reject"
                      (click)="$event.preventDefault(); onReject(p)"
                    >
                      <i class="fas fa-ban"></i>
                    </a>
                  </td>
                </tr>
                <tr *ngIf="posts.length === 0">
                  <td colspan="6" class="text-center text-muted p-3">
                    No posts found
                  </td>
                </tr>
              </tbody>
            </table>
          </div>
          <!-- /.card-body -->
          <div class="card-footer clearfix">
            <ul class="pagination pagination-sm m-0 float-right">
              <li class="page-item" [class.disabled]="currentPage === 1">
                <a class="page-link" (click)="onPageChange(currentPage - 1)"
                  >«</a
                >
              </li>
              <li
                class="page-item"
                *ngFor="let p of getPagesArray()"
                [class.active]="p === currentPage"
              >
                <a class="page-link" (click)="onPageChange(p)">{{ p }}</a>
              </li>
              <li
                class="page-item"
                [class.disabled]="currentPage === totalPages"
              >
                <a class="page-link" (click)="onPageChange(currentPage + 1)"
                  >»</a
                >
              </li>
            </ul>
          </div>
        </div>
        <!-- /.card -->
      </div>
    </div>
  </div>
</section>
