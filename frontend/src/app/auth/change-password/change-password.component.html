<div class="container py-4">
  <div class="row justify-content-center">
    <div class="col-md-8 col-lg-6">
      <div class="card shadow border-0">
        <div class="card-header bg-primary text-white">
          <h5 class="mb-0">{{ 'PASSWORD.TITLE' | translate }}</h5>
        </div>
        <div class="card-body p-4">
          <form [formGroup]="passwordForm" (ngSubmit)="onSubmit()" novalidate>
            
            <!-- Current Password -->
            <div class="mb-3">
              <label for="currentPassword" class="form-label">
                {{ 'PASSWORD.CURRENT' | translate }}
              </label>
              <div class="input-group">
                <input 
                  [type]="showCurrentPassword ? 'text' : 'password'" 
                  class="form-control" 
                  id="currentPassword" 
                  formControlName="currentPassword"
                  [ngClass]="{'is-invalid': isFieldInvalid('currentPassword')}"
                  placeholder="{{ 'PASSWORD.CURRENT_PLACEHOLDER' | translate }}">
                <button 
                  type="button" 
                  class="btn btn-outline-secondary" 
                  (click)="togglePasswordVisibility('currentPassword')">
                  <i class="fa" [ngClass]="showCurrentPassword ? 'fa-eye-slash' : 'fa-eye'"></i>
                </button>
                <div *ngIf="isFieldInvalid('currentPassword')" class="invalid-feedback">
                  {{ getErrorMessage('currentPassword') }}
                </div>
              </div>
            </div>

            <!-- New Password -->
            <div class="mb-3">
              <label for="newPassword" class="form-label">
                {{ 'PASSWORD.NEW' | translate }}
              </label>
              <div class="input-group">
                <input 
                  [type]="showNewPassword ? 'text' : 'password'" 
                  class="form-control" 
                  id="newPassword" 
                  formControlName="newPassword"
                  [ngClass]="{'is-invalid': isFieldInvalid('newPassword')}"
                  placeholder="{{ 'PASSWORD.NEW_PLACEHOLDER' | translate }}">
                <button 
                  type="button" 
                  class="btn btn-outline-secondary" 
                  (click)="togglePasswordVisibility('newPassword')">
                  <i class="fa" [ngClass]="showNewPassword ? 'fa-eye-slash' : 'fa-eye'"></i>
                </button>
                <div *ngIf="isFieldInvalid('newPassword')" class="invalid-feedback">
                  {{ getErrorMessage('newPassword') }}
                </div>
              </div>
              
              <!-- Password strength meter -->
              <div *ngIf="passwordForm.get('newPassword')?.value" class="mt-2">
                <div class="progress" style="height: 5px;">
                  <div 
                    class="progress-bar" 
                    role="progressbar" 
                    [ngStyle]="{'width': getPasswordStrength().strength + '%', 'background-color': getPasswordStrength().color}"
                    [attr.aria-valuenow]="getPasswordStrength().strength" 
                    aria-valuemin="0" 
                    aria-valuemax="100">
                  </div>
                </div>
                <small class="text-muted">
                  {{ 'PASSWORD.STRENGTH' | translate }}: 
                  <span [style.color]="getPasswordStrength().color">
                    {{ getPasswordStrength().label }}
                  </span>
                </small>
              </div>
              
              <!-- Password requirements hint -->
              <div class="mt-2 small text-muted">
                {{ 'PASSWORD.REQUIREMENTS' | translate }}
              </div>
            </div>

            <!-- Confirm Password -->
            <div class="mb-4">
              <label for="confirmPassword" class="form-label">
                {{ 'PASSWORD.CONFIRM' | translate }}
              </label>
              <div class="input-group">
                <input 
                  [type]="showConfirmPassword ? 'text' : 'password'" 
                  class="form-control" 
                  id="confirmPassword" 
                  formControlName="confirmPassword"
                  [ngClass]="{'is-invalid': isFieldInvalid('confirmPassword')}"
                  placeholder="{{ 'PASSWORD.CONFIRM_PLACEHOLDER' | translate }}">
                <button 
                  type="button" 
                  class="btn btn-outline-secondary" 
                  (click)="togglePasswordVisibility('confirmPassword')">
                  <i class="fa" [ngClass]="showConfirmPassword ? 'fa-eye-slash' : 'fa-eye'"></i>
                </button>
                <div *ngIf="isFieldInvalid('confirmPassword')" class="invalid-feedback">
                  {{ getErrorMessage('confirmPassword') }}
                </div>
              </div>
            </div>

            <!-- Submit Button -->
            <div class="d-grid gap-2">
              <button 
                type="submit" 
                class="btn btn-primary" 
                [disabled]="passwordForm.invalid || isLoading">
                <span *ngIf="isLoading" class="spinner-border spinner-border-sm me-2" role="status" aria-hidden="true"></span>
                {{ isLoading ? ('PASSWORD.UPDATING' | translate) : ('PASSWORD.UPDATE' | translate) }}
              </button>
            </div>
          </form>
        </div>
      </div>
    </div>
  </div>
</div>
