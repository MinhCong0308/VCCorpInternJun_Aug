<div class="wrapper" *ngIf="true">
  <!-- Navbar -->
  <nav class="main-header navbar navbar-expand navbar-white navbar-light">
    <ul class="navbar-nav">
      <li class="nav-item">
        <a class="nav-link" href="#" role="button" data-widget="pushmenu">
          <i class="fas fa-bars"></i>
        </a>
      </li>
      <li class="nav-item d-none d-sm-inline-block">
        <a routerLink="/admin/dashboard" class="nav-link">Home</a>
      </li>
      <li class="nav-item d-none d-sm-inline-block">
        <a routerLink="/" class="nav-link">Back to Blog</a>
      </li>
    </ul>
    <ul class="navbar-nav ml-auto">
      <li class="nav-item">
        <a class="nav-link" data-widget="fullscreen" href="#" role="button">
          <i class="fas fa-expand-arrows-alt"></i>
        </a>
      </li>
    </ul>
  </nav>

  <!-- Main Sidebar -->
  <aside class="main-sidebar sidebar-dark-primary elevation-4">
    <a routerLink="/admin/dashboard" class="brand-link">
      <i class="fas fa-blog mr-2"></i>
      <span class="brand-text font-weight-light">Blog Admin</span>
    </a>
    <div class="sidebar">
      <!-- Sidebar user panel -->
      <div
        class="user-panel mt-3 pb-3 mb-3 d-flex flex-column align-items-start"
      >
        <div class="d-flex align-items-center">
          <div class="image mr-2">
            <img
              src="https://yt3.ggpht.com/-VaLs3_hqTZI/AAAAAAAAAAI/AAAAAAAAAAA/ojQAzrdMHLQ/s900-c-k-no/photo.jpg"
              class="img-circle elevation-2"
              alt="User Image"
            />
          </div>
          <div class="info">
            <a routerLink="/admin/dashboard" class="d-block">ADMIN</a>
          </div>
        </div>

        <button
          type="button"
          class="btn btn-sm btn-danger mt-3 ml-3"
          (click)="logout()"
        >
          <i class="fas fa-sign-out-alt mr-1"></i> Log out
        </button>
      </div>
      <nav class="mt-2">
        <ul
          class="nav nav-pills nav-sidebar flex-column"
          data-widget="treeview"
          role="menu"
        >
          <li class="nav-item">
            <a
              routerLink="/admin/dashboard"
              routerLinkActive="active"
              [routerLinkActiveOptions]="{ exact: true }"
              class="nav-link"
            >
              <i class="nav-icon fas fa-tachometer-alt"></i>
              <p>Dashboard</p>
            </a>
          </li>
          <li class="nav-item">
            <a
              routerLink="/admin/posts"
              routerLinkActive="active"
              class="nav-link"
            >
              <i class="nav-icon fas fa-file-alt"></i>
              <p>Posts</p>
            </a>
          </li>
          <li class="nav-item">
            <a
              routerLink="/admin/categories"
              routerLinkActive="active"
              class="nav-link"
            >
              <i class="nav-icon fas fa-tags"></i>
              <p>Categories</p>
            </a>
          </li>
          <li class="nav-item">
            <a
              routerLink="/admin/users"
              routerLinkActive="active"
              class="nav-link"
            >
              <i class="nav-icon fas fa-users"></i>
              <p>Users</p>
            </a>
          </li>
          <li class="nav-item">
            <a
              routerLink="/admin/languages"
              routerLinkActive="active"
              class="nav-link"
            >
              <i class="nav-icon fas fa-language"></i>
              <p>Languages</p>
            </a>
          </li>
        </ul>
      </nav>
    </div>
  </aside>

  <!-- Content Wrapper -->
  <div class="content-wrapper">
    <router-outlet></router-outlet>
  </div>

  <footer class="main-footer">
    <strong>Copyright © 2024 MSTBlog Admin.</strong>
    All rights reserved.
  </footer>
</div>
