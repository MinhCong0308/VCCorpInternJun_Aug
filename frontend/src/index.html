<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Blogapp</title>
    <base href="/" />

    <meta name="viewport" content="width=device-width, initial-scale=1" />
    
    <!-- Method 5: Preload critical resources to prevent FOUC -->
    <!-- Preload Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="preload" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700&family=Playfair+Display:wght@700&display=swap" as="style" onload="this.onload=null;this.rel='stylesheet'" />
    
    <!-- Preload Bootstrap CSS -->
    <link rel="preload" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" as="style" onload="this.onload=null;this.rel='stylesheet'" />
    
    <!-- Preload Quill CSS -->
    <link rel="preload" href="https://cdn.quilljs.com/1.3.6/quill.snow.css" as="style" onload="this.onload=null;this.rel='stylesheet'" />
    
    <!-- Preload custom stylesheets -->
    <link rel="preload" href="../assets/css/home_style.css" as="style" onload="this.onload=null;this.rel='stylesheet'" />
    <link rel="preload" href="../assets/css/writeBlog_style.css" as="style" onload="this.onload=null;this.rel='stylesheet'" />
    
    <!-- Preload critical JavaScript -->
    <link rel="preload" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js" as="script" />
    <link rel="preload" href="https://cdn.quilljs.com/1.3.6/quill.js" as="script" />
    
    <!-- Fallback for browsers that don't support preload -->
    <noscript>
      <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700&family=Playfair+Display:wght@700&display=swap" />
      <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" />
      <link rel="stylesheet" href="https://cdn.quilljs.com/1.3.6/quill.snow.css" />
      <link rel="stylesheet" href="../assets/css/home_style.css" />
      <link rel="stylesheet" href="../assets/css/writeBlog_style.css" />
    </noscript>
    
    <style>
      :root {
        --heading-font: 'Playfair Display', serif;
        --body-font: 'Inter', sans-serif;
        --text-primary: #000;
        --text-secondary: #6c757d;
        --border-color: #e0e0e0;
        --background-color: #ffffff;
      }
      
      html, body {
        font-family: var(--body-font);
        background-color: var(--background-color);
        color: var(--text-primary);
        margin: 0;
        padding: 0;
        height: 100%;
      }
      
      body {
        display: flex;
        flex-direction: column;
        min-height: 100vh;
        opacity: 0;
        transition: opacity 0.3s ease;
      }
      
      body.loaded {
        opacity: 1;
      }
      
      .main-content {
        visibility: hidden;
      }
      
      .fonts-loaded .main-content {
        visibility: visible;
      }
      
      .loading-overlay {
        position: fixed;
        top: 0;
        left: 0;
        right: 0;
        bottom: 0;
        background: #ffffff;
        display: flex;
        align-items: center;
        justify-content: center;
        z-index: 9999;
        opacity: 1;
        transition: opacity 0.3s ease;
      }
      
      .loading-overlay.fade-out {
        opacity: 0;
        pointer-events: none;
      }
      
      .loading-spinner {
        width: 40px;
        height: 40px;
        border: 3px solid #f3f3f3;
        border-top: 3px solid #007bff;
        border-radius: 50%;
        animation: spin 1s linear infinite;
      }
      
      @keyframes spin {
        0% { transform: rotate(0deg); }
        100% { transform: rotate(360deg); }
      }
    </style>
    
    <!-- Font loading detection script -->
    <script>
      if ('fonts' in document) {
        document.fonts.ready.then(function() {
          document.documentElement.classList.add('fonts-loaded');
          document.body.classList.add('loaded');
          
          const overlay = document.querySelector('.loading-overlay');
          if (overlay) {
            overlay.classList.add('fade-out');
            setTimeout(() => overlay.remove(), 300);
          }
        });
      } else {
        window.addEventListener('load', function() {
          setTimeout(function() {
            document.documentElement.classList.add('fonts-loaded');
            document.body.classList.add('loaded');
            
            const overlay = document.querySelector('.loading-overlay');
            if (overlay) {
              overlay.classList.add('fade-out');
              setTimeout(() => overlay.remove(), 300);
            }
          }, 100);
        });
      }
    </script>
  </head>

  <body>
    <div class="loading-overlay">
      <div class="loading-spinner"></div>
    </div>
    
    <app-root></app-root>
  </body>
</html>
